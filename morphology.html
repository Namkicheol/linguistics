<script>
const Q=[
  {
    "src": "Morpheme",
    "cat": "definition",
    "text": "A <span class='kw1'>bound morpheme</span> cannot stand alone as a word and must attach to another form, as with <em>-ness</em> in <em>brightness</em> or <em>re-</em> in <em>reopen</em>.",
    "ans": true,
    "correct": "<span class='kw1'>bound morpheme</span>의 정의로 정확하다 — 독립된 단어로 쓰일 수 없고 다른 형태에 붙어야 한다.",
    "why": "bound morpheme은 혼자 단어가 되지 못하고 반드시 base에 부착됩니다. <em>-ness</em>·<em>re-</em>처럼 모든 affix가 여기에 속합니다. 반대로 <em>bright</em>·<em>open</em>은 독립된 단어로 쓰일 수 있는 free morpheme입니다.",
    "source": "A bound morpheme cannot stand alone and must attach to another form (e.g., -ness, re-).",
    "compare": [
      {
        "title": "Free morpheme",
        "desc": "bright, open — 단독 단어 가능"
      },
      {
        "title": "Bound morpheme",
        "desc": "-ness, re- — 부착 필수"
      }
    ]
  },
  {
    "src": "Morpheme",
    "cat": "affixes are bound",
    "text": "In English, every affix — both <span class='kw1'>prefixes</span> and <span class='kw1'>suffixes</span> — is a bound morpheme.",
    "ans": true,
    "correct": "영어의 모든 affix(prefix·suffix)는 <span class='kw2'>bound morpheme</span>이다.",
    "why": "영어에서 affix는 prefix이든 suffix이든 단독으로 단어가 될 수 없어 항상 base에 붙어야 합니다. 따라서 모든 affix는 정의상 bound morpheme입니다.",
    "source": "All affixes (prefixes and suffixes) in English are bound morphemes."
  },
  {
    "src": "Morpheme",
    "cat": "definition trap",
    "text": "A morpheme is best defined as <span class='kw4'>the smallest unit that can always stand alone as an independent word</span>.",
    "ans": false,
    "correct": "morpheme은 의미·문법 기능의 <span class='kw2'>최소 단위</span>일 뿐이며, bound morpheme은 독립된 단어로 쓰일 수 없다.",
    "why": "morpheme은 minimal unit of meaning or grammatical function으로 정의됩니다. 독립된 단어로 쓰일 수 있는 것은 free morpheme에 한정되며, <em>-ed</em>·<em>un-</em> 같은 bound morpheme은 독립 단어가 될 수 없습니다.",
    "source": "A morpheme is the minimal unit of meaning/function; bound morphemes cannot stand alone."
  },
  {
    "src": "Inflection",
    "cat": "inventory · suffix",
    "text": "The traditional teaching inventory of Modern English lists <span class=\"kw1\">eight inflectional suffixes</span>.",
    "ans": true,
    "correct": "전통적 목록은 grammatical function에 따라 8개의 inflectional suffix를 구별한다.",
    "why": "영어의 8 inflections는 noun <em>-'s</em>(possessive)·<em>-s</em>(plural), verb <em>-s</em>(3sg)·<em>-ing</em>·<em>-ed</em>·<em>-en</em>, adjective <em>-er</em>(comparative)·<em>-est</em>(superlative)이며, 모두 suffix입니다. inflectional prefix는 없습니다. 이 목록을 모든 inflected form이 규칙적 suffix 추가로만 만들어진다는 뜻으로 해석하지 않습니다. <em>brought</em> 같은 irregular past도 inflection입니다.",
    "source": "The traditional eight-suffix inventory does not exclude irregular inflected forms.",
    "compare": [
      {
        "title": "Noun",
        "desc": "-'s, -s"
      },
      {
        "title": "Verb · Adj",
        "desc": "-s, -ing, -ed, -en / -er, -est"
      }
    ]
  },
  {
    "src": "Inflection",
    "cat": "category-preserving",
    "text": "An <span class='kw1'>inflectional morpheme</span> never changes the grammatical category of the word it attaches to.",
    "ans": true,
    "correct": "inflection은 <span class='kw2'>category-preserving</span> — 품사를 절대 바꾸지 않는다.",
    "why": "inflection은 수·시제·비교·소유 같은 문법 기능만 표시하고 품사를 유지합니다. <em>walk → walks/walked/walking</em>은 모두 verb로 남고, <em>tall → taller/tallest</em>는 모두 adjective입니다.",
    "source": "Inflection is category-preserving; it never changes the part of speech."
  },
  {
    "src": "Derivation",
    "cat": "class-changing suffix",
    "text": "The suffix <em>-ize</em> in <em>standardize</em> is a <span class='kw1'>class-changing</span> derivational affix.",
    "ans": true,
    "correct": "<em>-ize</em>는 품사를 바꾸는 <span class='kw2'>class-changing</span> derivational suffix다 (A/N→V).",
    "why": "<em>standard</em>(N/A) + <em>-ize</em> → <em>standardize</em>(V)로 품사가 바뀝니다. 이렇게 새 단어를 만들고 품사를 바꾸는 affix는 derivational이며, 그중 품사를 바꾸는 것을 class-changing이라 합니다.",
    "source": "-ize is a class-changing derivational suffix (N/A → V)."
  },
  {
    "src": "Inflection",
    "cat": "-er homophony trap",
    "text": "The <em>-er</em> in <em>painter</em> is an <span class='kw4'>inflectional</span> morpheme, just like the <em>-er</em> in <em>shorter</em>.",
    "ans": false,
    "correct": "<em>painter</em>의 <em>-er</em>는 agentive <span class='kw2'>derivational</span>(V→N)이고, <em>shorter</em>의 <em>-er</em>는 comparative inflection이다 — 동음이지만 다른 morpheme.",
    "why": "<em>paint</em>(V) + agentive <em>-er</em> → <em>painter</em>(N)는 품사를 바꾸는 derivation입니다. 반면 <em>short</em> → <em>shorter</em>의 <em>-er</em>는 comparative inflection(adj→adj)으로 품사를 유지합니다. 형태는 같아도 서로 다른 morpheme입니다.",
    "source": "Agentive -er (painter) is derivational (V→N); comparative -er (shorter) is inflectional.",
    "compare": [
      {
        "title": "derivational -er",
        "desc": "painter (V→N), agentive"
      },
      {
        "title": "inflectional -er",
        "desc": "shorter (adj), comparative"
      }
    ]
  },
  {
    "src": "Inflection",
    "cat": "un- is not inflection",
    "text": "The <em>un-</em> in <em>unfriendly</em> is an <span class='kw4'>inflectional prefix</span>.",
    "ans": false,
    "correct": "<em>un-</em>는 <span class='kw2'>derivational</span> prefix다. 영어 inflection에는 prefix가 없다(모두 suffix).",
    "why": "영어의 inflection 8개는 모두 suffix이므로 inflectional prefix는 존재하지 않습니다. <em>un-</em>는 새 단어를 만드는 derivational prefix(adj→adj)입니다.",
    "source": "English has no inflectional prefixes; un- is derivational."
  },
  {
    "src": "Inflection",
    "cat": "count trap",
    "text": "The traditional English inflectional-affix inventory contains <span class=\"kw4\">twelve suffixes and several prefixes</span>.",
    "ans": false,
    "correct": "이 전통적 목록은 8개 suffix이며, prefix를 포함하지 않는다.",
    "why": "plural·possessive, 3sg·progressive·past·past participle, comparative·superlative의 8가지 suffix를 구별하는 목록입니다. irregular form의 존재와 목록의 개수를 구별합니다.",
    "source": "The traditional inventory lists eight inflectional suffixes."
  },

const TOTAL=Q.length;
const SAVE_KEY='linguistics_morphology_quiz_v2';
let cur=0,answers=new Array(TOTAL).fill(null),mode='normal',order=[...Array(TOTAL).keys()];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function freshStart(){cur=0;answers=new Array(TOTAL).fill(null);clearProgress();if(mode==='random')order=shuffle([...Array(TOTAL).keys()]);saveProgress();document.getElementById('rb').style.display='none';render();}
function setMode(m){if(mode===m)return;mode=m;order=m==='random'?shuffle([...Array(TOTAL).keys()]):[...Array(TOTAL).keys()];cur=0;answers=new Array(TOTAL).fill(null);clearProgress();updateModeUI();render();}
function updateModeUI(){document.getElementById('btn-normal').classList.toggle('active',mode==='normal');document.getElementById('btn-random').classList.toggle('active',mode==='random');}
function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({cur,answers,mode,order}));}catch(e){/* Keep the quiz usable when storage is unavailable or full. */}}
function clearProgress(){try{localStorage.removeItem(SAVE_KEY);}catch(e){/* Storage may be unavailable. */}}
function getScore(){return answers.filter(a=>a&&a.correct).length;}
function renderNav(){
  document.getElementById('nav').innerHTML=answers.map((_,i)=>{
    const a=answers[i];
    const cls=i===cur?'nd cur':a===null?'nd':a.correct?'nd ok':'nd ng';
    return `<button class="${cls}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');
}
function jumpTo(i){cur=i;render();}
function renderExp(q,isCorrect){
  const three=q.compare&&q.compare.length===3;
  const cmp=q.compare?`
    <div class="sec-label">📊 비교 정리</div>
    <div class="compare${three?' three':''}">
      ${q.compare.map(c=>`<div class="compare-item"><div class="ci-title">${c.title}</div><p>${c.desc}</p></div>`).join('')}
    </div>`:'';
  return `<div class="exp show">
    <div class="exp-header"><span>${isCorrect?'✅ 정답':'❌ 오답'} · 해설</span></div>
    <div class="exp-answer"><div class="ans-label">핵심 정리</div><div class="ans-text">${q.correct}</div></div>
    <div class="exp-body">
      <div class="sec-label">📖 상세 설명</div><p>${q.why}</p>
      <div class="sec-label">📌 핵심 원리 (재서술)</div>
      <div class="def-box"><p>${q.source}</p></div>
      ${cmp}
    </div>
  </div>`;
}
function render(){
  if(cur>=TOTAL){
    document.getElementById('qa').style.display='none';
    document.getElementById('sc').classList.add('show');
    const s=getScore();
    document.getElementById('fs').textContent=s;
    const p=s/TOTAL;
    document.getElementById('rm').textContent=p===1?'🎉 Perfect!':p>=.8?'👏 Great!':p>=.6?'😊 Good!':'💪 Keep going!';
    document.getElementById('rs').textContent=`${TOTAL}문제 중 ${s}문제 정답 (${Math.round(p*100)}%)`;
    setTimeout(function(){window.showScorePopup&&window.showScorePopup(s,TOTAL);},400);
    renderNav();return;
  }
  document.getElementById('sc').classList.remove('show');
  document.getElementById('qa').style.display='block';
  renderNav();
  const q=Q[order[cur]];
  document.getElementById('bf').style.width=((cur+1)/TOTAL*100).toFixed(1)+'%';
  document.getElementById('pt').textContent=`${cur+1} / ${TOTAL}`;
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  const a=answers[cur];
  if(a!==null){
    let oBtnCls='',xBtnCls='';
    if(a.picked===true){oBtnCls=a.correct?'co':'wp';if(!a.correct)xBtnCls='cx';}
    else{xBtnCls=a.correct?'cx':'wp';if(!a.correct)oBtnCls='co';}
    document.getElementById('qa').innerHTML=`
      <div class="card">
        <div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div>
        <div class="q-text">${q.text}</div>
        <div class="ox-btns">
          <button class="ox-btn o-btn ${oBtnCls}" disabled>⭕<span class="lb">CORRECT</span></button>
          <button class="ox-btn x-btn ${xBtnCls}" disabled>❌<span class="lb">WRONG</span></button>
        </div>
        <div class="badge ${a.correct?'ok':'ng'}">${a.correct?'✅ 정답!':'❌ 오답! 정답은 '+(q.ans?'O':'X')}</div>
        <div>${renderExp(q,a.correct)}</div>
        <button class="next-btn show" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button>
      </div>`;
  }else{
    document.getElementById('qa').innerHTML=`
      <div class="card">
        <div class="q-meta"><span class="q-num">Q${cur+1}</span><span class="q-src">${q.src}</span><span class="q-cat">${q.cat}</span></div>
        <div class="q-text">${q.text}</div>
        <div class="ox-btns">
          <button class="ox-btn o-btn" onclick="pick(true)" id="ob">⭕<span class="lb">CORRECT</span></button>
          <button class="ox-btn x-btn" onclick="pick(false)" id="xb">❌<span class="lb">WRONG</span></button>
        </div>
        <div id="bd" class="badge"></div>
        <div id="ep"></div>
        <button class="next-btn" id="nb" onclick="next()">${cur<TOTAL-1?'Next →':'결과 보기 →'}</button>
      </div>`;
  }
}
function pick(val){
  const q=Q[order[cur]];
  document.getElementById('ob').disabled=true;
  document.getElementById('xb').disabled=true;
  const ok=val===q.ans;
  answers[cur]={picked:val,correct:ok};
  saveProgress();
  if(ok){if(typeof playOk==='function')playOk();}else{if(typeof playNg==='function')playNg();}
  const bd=document.getElementById('bd');
  bd.textContent=ok?'✅ 정답!':`❌ 오답! 정답은 ${q.ans?'O':'X'}`;
  bd.className='badge '+(ok?'ok':'ng');
  document.getElementById(val?'ob':'xb').classList.add(ok?(val?'co':'cx'):'wp');
  if(!ok)document.getElementById(q.ans?'ob':'xb').classList.add(q.ans?'co':'cx');
  document.getElementById('ep').innerHTML=renderExp(q,ok);
  document.getElementById('nb').classList.add('show');
  document.getElementById('ps').textContent=`정답 ${getScore()}개`;
  renderNav();
}
function next(){cur++;if(cur>=TOTAL){clearProgress();}else{saveProgress();}render();}
function restart(){cur=0;answers=new Array(TOTAL).fill(null);clearProgress();document.getElementById('sc').classList.remove('show');document.getElementById('rb').style.display='none';document.getElementById('qa').style.display='block';renderNav();render();}
(function(){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){}
  const valid=saved && Number.isInteger(saved.cur) && saved.cur>=0 && saved.cur<TOTAL
    && ['normal','random'].includes(saved.mode)
    && Array.isArray(saved.answers) && saved.answers.length===TOTAL
    && saved.answers.every(a=>a===null || (typeof a==='object' && typeof a.picked==='boolean' && typeof a.correct==='boolean'))
    && Array.isArray(saved.order) && saved.order.length===TOTAL && new Set(saved.order).size===TOTAL
    && saved.order.every(i=>Number.isInteger(i)&&i>=0&&i<TOTAL)
    && (saved.mode!=='normal' || saved.order.every((x,i)=>x===i));
  if(valid){
    cur=saved.cur;mode=saved.mode;order=saved.order;
    answers=saved.answers.map((a,i)=>a===null?null:{picked:a.picked,correct:a.picked===Q[order[i]].ans});
    const done=answers.filter(a=>a!==null).length;
    if(done>0){document.getElementById('rb-msg').textContent=`이어서 풀기 중 · ${done}/${TOTAL} 문제 완료 (정답 ${getScore()}개)`;document.getElementById('rb').style.display='block';}
  }
  updateModeUI();renderNav();render();
})();
</script>
<script src="./study-return.js" data-hub-label="영어학 허브"></script>
</body>
