<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title desc"><title id="title">Synthetic formant reading chart</title><desc id="desc">Time on horizontal axis, frequency on vertical axis. F1 remains at500Hz. F2 rises from1500 to2300Hz. Final F2 segment is darker.</desc><rect width="680" height="330" fill="#fff"/><g fill="none" stroke="#d5ded8"><path d="M80 260H610M80 190H610M80 120H610M80 50H610"/><path d="M80 50V260M255 50V260M430 50V260M605 50V260"/></g><g fill="none" stroke="#263f35" stroke-width="2"><path d="M80 35V260H625"/></g><g font-family="sans-serif" font-size="15" fill="#263f35"><text x="15" y="25">Hz</text><text x="40" y="265">0</text><text x="28" y="195">1000</text><text x="28" y="125">2000</text><text x="28" y="55">3000</text><text x="75" y="285">0</text><text x="245" y="285">50</text><text x="415" y="285">100</text><text x="590" y="285">150</text><text x="535" y="315">Time (ms)</text><text x="100" y="210">F1</text><text x="100" y="140">F2</text><text x="190" y="24">Synthetic diagram — not a recording</text></g><path d="M80 225H605" stroke="#698d7f" stroke-width="9"/><path d="M80 155L430 115" stroke="#9db7ac" stroke-width="12"/><path d="M430 115L605 99" stroke="#224a39" stroke-width="12"/></svg>
